name: Deploy Pixel V5 to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "pixel-v5/**"
      - ".github/workflows/deploy-pixel-v5-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pixel-v5-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload Pixel V5
        uses: actions/upload-pages-artifact@v3
        with:
          path: pixel-v5
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
