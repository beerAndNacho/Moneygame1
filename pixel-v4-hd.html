<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover" />
<meta name="theme-color" content="#04101a" />
<title>통발 굴리는 날 · Pixel V4 HD</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#02070c;color:#edf8f3;font-family:system-ui,"Noto Sans KR",sans-serif}body{display:grid;place-items:center}.boot{width:min(340px,calc(100% - 36px));padding:18px;border:1px solid #65d1bd;background:#061825;text-align:center;box-shadow:4px 4px #000}.ring{width:38px;height:38px;margin:0 auto 13px;border:4px solid #173b46;border-top-color:#f0cc60;border-radius:50%;animation:spin .8s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}strong{display:block;margin-bottom:8px}small{color:#99b7b2;line-height:1.6}.error button{border:1px solid #65d1bd;background:#164a52;color:#fff;padding:10px 16px;font-weight:800}
</style>
</head>
<body>
<main class="boot"><div class="ring"></div><strong>HD 픽셀 화면을 준비하는 중…</strong><small>기기 해상도에 맞춰 글자와 HUD를 다시 렌더링하고 있습니다.</small></main>
<script>
(async()=>{
  const SOURCE='https://cdn.jsdelivr.net/gh/beerAndNacho/Moneygame1@22a761ce4fee0203988817b9e0f119654c798ddf/pixel-v4.html';
  try{
    const response=await fetch(SOURCE,{cache:'no-store'});
    if(!response.ok)throw new Error('게임 소스 응답 '+response.status);
    let html=await response.text();

    const replacements=[
      ['<title>통발 굴리는 날 · Pixel V4</title>','<title>통발 굴리는 날 · Pixel V4 HD</title>'],
      ['#shell{position:relative;height:100dvh;max-height:100dvh;aspect-ratio:216/468;max-width:100vw;','#shell{position:relative;width:216px;height:468px;'],
      ['@media (min-aspect-ratio:216/468){#shell{height:100dvh;width:auto}}@media (max-aspect-ratio:216/468){#shell{width:100vw;height:auto}}',''],
      ["const canvas=document.getElementById('game'),ctx=canvas.getContext('2d',{alpha:false});ctx.imageSmoothingEnabled=false;\nconst gate=document.getElementById('gate'),startBtn=document.getElementById('startBtn'),soundBtn=document.getElementById('soundBtn'),toastEl=document.getElementById('toast'),fallback=document.getElementById('fallback');",`const shell=document.getElementById('shell');
const canvas=document.getElementById('game'),ctx=canvas.getContext('2d',{alpha:false,desynchronized:true});
const gate=document.getElementById('gate'),startBtn=document.getElementById('startBtn'),soundBtn=document.getElementById('soundBtn'),toastEl=document.getElementById('toast'),fallback=document.getElementById('fallback');
let BUFFER_SCALE=2,DISPLAY_SCALE=1;
function resizeSharpCanvas(){
  const viewport=window.visualViewport;
  const vw=Math.max(216,Math.floor(viewport?.width||window.innerWidth||216));
  const vh=Math.max(468,Math.floor(viewport?.height||window.innerHeight||468));
  DISPLAY_SCALE=Math.min(vw/W,vh/H);
  const dpr=Math.min(4,Math.max(1,window.devicePixelRatio||1));
  BUFFER_SCALE=Math.min(8,Math.max(2,Math.ceil(DISPLAY_SCALE*dpr)));
  const cssW=Math.max(W,Math.floor(W*DISPLAY_SCALE));
  const cssH=Math.max(H,Math.floor(H*DISPLAY_SCALE));
  if(canvas.width!==W*BUFFER_SCALE||canvas.height!==H*BUFFER_SCALE){
    canvas.width=W*BUFFER_SCALE;
    canvas.height=H*BUFFER_SCALE;
  }
  shell.style.width=cssW+'px';
  shell.style.height=cssH+'px';
  shell.style.maxWidth='none';
  shell.style.maxHeight='none';
  shell.style.aspectRatio='auto';
  canvas.style.width=cssW+'px';
  canvas.style.height=cssH+'px';
  ctx.setTransform(BUFFER_SCALE,0,0,BUFFER_SCALE,0,0);
  ctx.imageSmoothingEnabled=false;
}
resizeSharpCanvas();
window.addEventListener('resize',resizeSharpCanvas,{passive:true});
window.visualViewport?.addEventListener('resize',resizeSharpCanvas,{passive:true});`],
      ["function text(t,x,y,size=8,c=C.white,align='left',weight='700'){ctx.fillStyle=c;ctx.font=`${weight} ${size}px ui-monospace,Menlo,Consolas,\"Noto Sans KR\",monospace`;ctx.textAlign=align;ctx.textBaseline='top';ctx.fillText(t,Math.round(x),Math.round(y))}","function text(t,x,y,size=8,c=C.white,align='left',weight='700'){ctx.fillStyle=c;ctx.font=`${weight} ${size}px system-ui,\"Noto Sans KR\",\"Noto Sans CJK KR\",sans-serif`;ctx.textAlign=align;ctx.textBaseline='top';ctx.fillText(t,Math.round(x),Math.round(y))}"],
      ["function render(){buttons=[];ctx.imageSmoothingEnabled=false;ctx.clearRect(0,0,W,H);","function render(){buttons=[];ctx.setTransform(BUFFER_SCALE,0,0,BUFFER_SCALE,0,0);ctx.imageSmoothingEnabled=false;ctx.clearRect(0,0,W,H);"],
      ["window.__pixelV4={getScene:()=>scene","window.__pixelV4={getRenderInfo:()=>({bufferScale:BUFFER_SCALE,displayScale:DISPLAY_SCALE,canvas:[canvas.width,canvas.height],css:[canvas.getBoundingClientRect().width,canvas.getBoundingClientRect().height],dpr:window.devicePixelRatio}),getScene:()=>scene"],
      ['원본 영상의 작은 배·긴 수중 공간·촘촘한 픽셀 HUD를 기준으로 다시 고도화했습니다.','작은 배와 깊은 바다의 도트 감성은 유지하고, 글자와 HUD는 기기 해상도에 맞춰 선명하게 렌더링합니다.']
    ];

    for(const [before,after] of replacements){
      if(!html.includes(before))throw new Error('HD 패치 기준 문자열을 찾지 못했습니다.');
      html=html.replace(before,after);
    }

    document.open();
    document.write(html);
    document.close();
  }catch(error){
    document.body.innerHTML='<main class="boot error"><strong>HD 게임을 불러오지 못했습니다</strong><small>'+String(error&&error.message?error.message:error)+'</small><p><button onclick="location.reload()">다시 시도</button></p></main>';
  }
})();
</script>
</body>
</html>
