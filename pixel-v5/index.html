<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#04101a"><title>통발 굴리는 날 · Pixel V5</title><style>html,body{margin:0;width:100%;height:100%;background:#02070c;color:#edf8f3;font-family:system-ui,sans-serif}body{display:grid;place-items:center}.boot{width:min(340px,calc(100% - 36px));padding:18px;border:1px solid #65d1bd;background:#061825;text-align:center;box-shadow:4px 4px #000}.ring{width:38px;height:38px;margin:0 auto 13px;border:4px solid #173b46;border-top-color:#f0cc60;border-radius:50%;animation:s .8s linear infinite}@keyframes s{to{transform:rotate(360deg)}}small{color:#99b7b2;line-height:1.6}button{border:1px solid #65d1bd;background:#164a52;color:#fff;padding:10px 16px;font-weight:800}</style></head><body><main class="boot"><div class="ring"></div><strong>섬마을 조업을 준비하는 중…</strong><p><small>어시장·선박소·창고·마을 데이터를 불러오고 있습니다.</small></p></main><script>(async()=>{try{if(!('DecompressionStream'in self))throw Error('Chrome 또는 최신 브라우저에서 열어주세요.');const names=["p0.txt", "p1.txt", "p2.txt", "p3.txt", "p4.txt"];const parts=await Promise.all(names.map(async n=>{const r=await fetch('./'+n,{cache:'no-store'});if(!r.ok)throw Error(n+' 응답 '+r.status);return r.text()}));const bytes=Uint8Array.from(atob(parts.join('')),c=>c.charCodeAt(0));const html=await new Response(new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'))).text();document.open();document.write(html);document.close()}catch(e){document.body.innerHTML='<main class="boot"><strong>게임을 불러오지 못했습니다</strong><p><small>'+String(e)+'</small></p><button onclick="location.reload()">다시 시도</button></main>'}})()</script></body></html>
