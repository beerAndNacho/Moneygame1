function button(x,y,w,h,label,id,enabled=true,accent=false,small=false){const over=pointer.x>=x&&pointer.x<=x+w&&pointer.y>=y&&pointer.y<=y+h;px(x+2,y+2,w,h,'#02070d');px(x,y,w,h,enabled?(accent?(over?'#245f61':'#164a52'):(over?'#0d3544':'#082735')):'#111d25');px(x,y,w,1,enabled?(accent?C.yellow:C.cyan):'#33444a');px(x,y,1,h,enabled?(accent?C.yellow:C.cyan):'#33444a');px(x+w-1,y,1,h,'#03131e');px(x,y+h-1,w,1,'#03131e');text(label,x+w/2,y+(h-(small?7:8))/2-(small?1:0),small?6:7,enabled?(accent?'#fff2ae':C.white):'#65777a','center');buttons.push({x,y,w,h,id,enabled})}

function fadeTo(next,after){transition={alpha:0,dir:1,next,after}}
function updateTransition(dt){if(!transition)return;transition.alpha+=dt*(transition.dir>0?3.8:-3.8);if(transition.dir>0&&transition.alpha>=1){transition.alpha=1;scene=transition.next;if(transition.after)transition.after();transition.dir=-1}else if(transition.dir<0&&transition.alpha<=0)transition=null}
class PixelAudio{constructor(){this.ctx=null;this.master=null;this.music=null;this.amb=null;this.sfx=null;this.next=0;this.step=0;this.timer=0;this.running=false;this.enabled=save.sound!==false;this.noise=null;this.reel=null;this.lastScene=''}ensure(){if(this.ctx)return;const AC=window.AudioContext||window.webkitAudioContext;if(!AC)throw Error('Web Audio 미지원');this.ctx=new AC();this.master=this.ctx.createGain();this.music=this.ctx.createGain();this.amb=this.ctx.createGain();this.sfx=this.ctx.createGain();this.master.gain.value=this.enabled?.82:.0001;this.music.gain.value=.28;this.amb.gain.value=.14;this.sfx.gain.value=.58;this.music.connect(this.master);this.amb.connect(this.master);this.sfx.connect(this.master);this.master.connect(this.ctx.destination)}async unlock(){this.ensure();if(this.ctx.state!=='running')await this.ctx.resume();if(!this.running){this.running=true;this.startAmbient();this.next=this.ctx.currentTime+.03;this.scheduler()}}scheduler(){if(!this.running)return;while(this.next<this.ctx.currentTime+.22){this.schedule(this.step++,this.next);this.next+=.25}this.timer=setTimeout(()=>this.scheduler(),65)}note(freq,when,dur=.12,type='square',vol=.04,bus=this.music){if(!this.ctx||!this.enabled||!freq)return;const o=this.ctx.createOscillator(),g=this.ctx.createGain();o.type=type;o.frequency.setValueAtTime(freq,when);g.gain.setValueAtTime(.0001,when);g.gain.exponentialRampToValueAtTime(vol,when+.006);g.gain.exponentialRampToValueAtTime(.0001,when+dur);o.connect(g);g.connect(bus);o.start(when);o.stop(when+dur+.03)}schedule(step,when){if(!this.enabled)return;const patterns={harbor:[220,0,277,0,330,0,277,0,196,0,247,0,294,0,247,0],deploy:[165,0,196,0,220,0,247,0,220,0,196,0,0,0,147,0],retrieve:[147,0,196,0,220,0,196,0,165,0,220,0,247,0,220,0],result:[262,330,392,0,330,392,523,0,392,523,659,0,523,392,330,0],upgrade:[196,0,247,0,294,0,247,0,175,0,220,0,262,0,220,0],dex:[220,0,330,0,294,0,247,0,196,0,294,0,262,0,220,0]};const key=scene==='retrieve'?'retrieve':scene==='deploy'?'deploy':scene==='result'?'result':scene==='upgrade'?'upgrade':scene==='dex'?'dex':'harbor',arr=patterns[key],f=arr[step%arr.length];if(f)this.note(f,when,key==='result'?.15:.13,'square',key==='retrieve'?.035:.028);if(step%4===0){const bass={harbor:[110,98,82.4,98],deploy:[82.4,73.4,65.4,73.4],retrieve:[73.4,82.4,98,82.4],result:[131,165,196,165],upgrade:[98,110,123,110],dex:[110,123,147,123]}[key];this.note(bass[(step/4)%4|0],when,.22,'triangle',.041)}if(key==='retrieve'&&run){const tension=run.tension/run.maxTension;if(step%2===1&&tension>.55)this.note(tension>.82?880:440,when,.035,'square',tension>.82?.034:.015,this.sfx);if(step%4===2&&run.event&&run.event.kind!=='calm')this.note(92,when,.07,'sawtooth',.026,this.sfx)}}startAmbient(){const len=this.ctx.sampleRate*2,buf=this.ctx.createBuffer(1,len,this.ctx.sampleRate),d=buf.getChannelData(0);let low=0;for(let i=0;i<len;i++){const white=Math.random()*2-1;low=low*.988+white*.012;d[i]=low*.82}const src=this.ctx.createBufferSource(),filter=this.ctx.createBiquadFilter(),gain=this.ctx.createGain();src.buffer=buf;src.loop=true;filter.type='lowpass';filter.frequency.value=520;gain.gain.value=.5;src.connect(filter);filter.connect(gain);gain.connect(this.amb);src.start();this.noise={src,filter,gain}}setScene(s){if(!this.noise)return;const f=s==='retrieve'?330:s==='deploy'?430:s==='harbor'?620:500;this.noise.filter.frequency.setTargetAtTime(f,this.ctx.currentTime,.25)}ping(kind='good'){if(!this.ctx||!this.enabled)return;const n=this.ctx.currentTime;if(kind==='perfect'){this.note(659,n,.08,'square',.11,this.sfx);this.note(988,n+.06,.12,'square',.08,this.sfx)}else if(kind==='rare'){[392,523,659,988].forEach((f,i)=>this.note(f,n+i*.065,.16,'square',.09,this.sfx))}else if(kind==='catch'){[330,440,554,659].forEach((f,i)=>this.note(f,n+i*.07,.14,'square',.075,this.sfx))}else if(kind==='warn'){this.note(92,n,.22,'sawtooth',.105,this.sfx)}else if(kind==='coin'){this.note(740,n,.06,'square',.08,this.sfx);this.note(988,n+.05,.09,'square',.065,this.sfx)}else this.note(440,n,.07,'square',.06,this.sfx)}startReel(){if(!this.ctx||!this.enabled||this.reel)return;const o=this.ctx.createOscillator(),g=this.ctx.createGain(),lfo=this.ctx.createOscillator(),lg=this.ctx.createGain();o.type='sawtooth';o.frequency.value=55;lfo.frequency.value=7.5;lg.gain.value=7;lfo.connect(lg);lg.connect(o.frequency);g.gain.value=.0001;o.connect(g);g.connect(this.sfx);const n=this.ctx.currentTime;g.gain.exponentialRampToValueAtTime(.031,n+.035);o.start();lfo.start();this.reel={o,g,lfo}}stopReel(){if(!this.reel||!this.ctx)return;const r=this.reel,n=this.ctx.currentTime;r.g.gain.cancelScheduledValues(n);r.g.gain.setValueAtTime(Math.max(.0001,r.g.gain.value),n);r.g.gain.exponentialRampToValueAtTime(.0001,n+.05);r.o.stop(n+.06);r.lfo.stop(n+.06);this.reel=null}toggle(){this.enabled=!this.enabled;save.sound=this.enabled;persist();if(this.master)this.master.gain.setTargetAtTime(this.enabled?.82:.0001,this.ctx.currentTime,.03);if(!this.enabled)this.stopReel();return this.enabled}}

function generateCatch(partial){const loc=run.loc,trap=run.trap,bait=run.bait,performance=clamp(.45+run.quality*.28+run.perfect*.025+run.maxCombo*.012-run.miss*.016,0.35,1.35),count=Math.max(1,Math.min(trap.cap,Math.round(1+Math.random()*(trap.cap-1)+run.quality*.7-(partial?1:0))));const items=[];for(let n=0;n<count;n++){let candidates=SPECIES.filter(s=>s.loc.includes(loc.id)),weights=candidates.map(s=>{let w=[66,26,8.5,1.7][s.tier];if(s.bait.includes(bait.id))w*=2;if(s.tier>=2)w*=1+bait.rare+trap.rare+save.upgrades.sonar*.025+save.streak*.02+run.weather.rare;if(s.id===run.featured.id&&n===0)w*=3.2;return w});let total=weights.reduce((a,b)=>a+b,0),r=Math.random()*total,sp=candidates[0];for(let i=0;i<candidates.length;i++){r-=weights[i];if(r<=0){sp=candidates[i];break}}const size=rand(sp.size[0],sp.size[1])*(.82+performance*.22),weight=rand(sp.weight[0],sp.weight[1])*(.82+performance*.26),record=!save.records[sp.id]||size>save.records[sp.id].size,newFound=!save.dex[sp.id],value=Math.round(sp.base*loc.mult*(.82+performance*.35)*(1+size/sp.size[1]*.25)*(partial?.58:1));items.push({sp,size,weight,value,record,newFound});save.dex[sp.id]=(save.dex[sp.id]||0)+1;if(record)save.records[sp.id]={size,weight};}const rare=items.some(v=>v.sp.tier>=2);if(save.mission.type==='trip')save.mission.progress++;if(save.mission.type==='perfect')save.mission.progress+=run.perfect;if(save.mission.type==='rare'&&rare)save.mission.progress++;save.mission.progress=Math.min(save.mission.progress,save.mission.target);persist();return{items,total:items.reduce((a,b)=>a+b.value,0),xp:Math.round(35+items.length*18+performance*25+items.reduce((a,b)=>a+b.sp.tier*12,0)),performance,partial,rare}}
function drawRetrieve(){const loc=run.loc,surf=104,floor=316;drawSky(surf);drawSea(surf,floor,loc);drawSideRocks(134,floor);drawFloor(floor,loc);const p=drawBoat(58,86,1,run.holding);drawHeader(`${loc.depth-(loc.depth*run.progress/100).toFixed(0)}m · ${['해저 이탈','중층 회수','수면 직전'][run.stage]}`,`${run.featured.behavior==='heavy'?'묵직한 어획':run.featured.behavior==='burst'?'강한 몸부림':run.featured.behavior==='cling'?'바닥에 붙는 움직임':run.featured.behavior==='zigzag'?'좌우로 흔들리는 움직임':'정체불명의 기척'}`);const trapY=295-run.progress*1.62;drawRopeTrap(p.ropeX,p.ropeY,trapY,run.ropeSway,true);drawCreatureShadow(run.featured,trapY);if(run.event?.kind==='shark')drawShark(12+((run.event.time/run.event.dur)*245),trapY-43);if(run.burstTime>0)drawBurst(trapY);if(run.stageFlash>0){ctx.globalAlpha=clamp(run.stageFlash*.45,0,.4);px(0,104,W,281,C.cyan2);ctx.globalAlpha=1;text(['해저 이탈','중층 회수','수면 직전'][run.stage],108,210,13,C.yellow,'center')}drawRetrieveUi()}

function drawResult(){drawSky(110);drawSea(110,468,run.loc);ctx.globalAlpha=.76;px(0,0,W,H,'#020811');ctx.globalAlpha=1;drawHeader(result.partial?'부분 회수':'조업 성공',`${run.loc.name} · ${rarityLabel(Math.max(...result.items.map(v=>v.sp.tier)))}`);const shown=Math.min(result.items.length,Math.floor(resultReveal)+1),main=result.items[Math.min(shown-1,result.items.length-1)];if(main){if(main.sp.tier>=2){ctx.globalAlpha=.15+Math.sin(time*4)*.05;for(let r=24;r<52;r+=8){ctx.strokeStyle=main.sp.colors[1];ctx.strokeRect(108-r/2,122-r/2,r,r)}ctx.globalAlpha=1}drawSpeciesIcon(main.sp,108,150,1,3.2);text(main.sp.name,108,205,11,C.white,'center');text(`${rarityLabel(main.sp.tier)}${main.newFound?' · 신규 발견':''}${main.record?' · 최고 기록':''}`,108,222,7,main.sp.tier>=2?C.yellow:C.cyan,'center');text(`${main.size.toFixed(1)}cm · ${main.weight.toFixed(2)}kg · ${main.value.toLocaleString()}조개`,108,236,6,C.muted,'center')}panel(9,257,198,96,'#061824');text(`포획 ${result.items.length}종`,16,264,7,C.cyan);text(`예상 총액 ${result.total.toLocaleString()}조개`,199,264,7,C.yellow,'right');for(let i=0;i<result.items.length;i++){const it=result.items[i],y=279+i*17,visible=i<shown;drawSpeciesIcon(it.sp,19,y+6,visible?1:.08,.55);text(visible?it.sp.name:'확인 중…',30,y+2,6,visible?C.white:C.muted);text(visible?`${it.value.toLocaleString()}`:'—',197,y+2,6,visible?C.yellow:C.muted,'right')}if(shown<result.items.length){text('화면을 눌러 다음 포획물 확인',108,370,7,C.cyan,'center')}else{button(11,371,194,30,`전부 판매 +${result.total.toLocaleString()}`,'sell',true,true);button(11,407,94,27,'판매 후 귀항','sellHarbor',true,false);button(111,407,94,27,`연속 조업 ×${save.streak+1}`,'continue',true,false);text(`경험치 +${result.xp} · 최고 콤보 ${run.maxCombo}`,108,442,6,C.muted,'center')}}
function updateResult(dt){if(!result)return;resultTimer+=dt;if(resultReveal<result.items.length-1&&resultTimer>(FAST?.15:1.05)){resultReveal++;resultTimer=0;const it=result.items[Math.floor(resultReveal)];audio.ping(it.sp.tier>=2?'rare':'catch')}}

function update(dt){time+=dt;if(scene==='deploy')updateDeploy(dt);else if(scene==='retrieve')updateRetrieve(dt);else if(scene==='result')updateResult(dt);updateTransition(dt)}
function loop(now){const dt=Math.min(.034,(now-last)/1000);last=now;update(dt);render();requestAnimationFrame(loop)}
function handleAction(id){if(id==='none')return;if(id==='claim')claimMission();else if(id==='locPrev')cycle('loc',-1);else if(id==='locNext')cycle('loc',1);else if(id==='trapPrev')cycle('trap',-1);else if(id==='trapNext')cycle('trap',1);else if(id==='baitPrev')cycle('bait',-1);else if(id==='baitNext')cycle('bait',1);else if(id==='launch')startDeploy();else if(id==='upgrade'){audio.setScene('upgrade');fadeTo('upgrade')}else if(id==='dex'){audio.setScene('dex');fadeTo('dex')}else if(id==='back'){audio.setScene('harbor');fadeTo('harbor')}else if(id==='place')lockPlacement();else if(id==='sell'||id==='sellHarbor')settleResult('harbor');else if(id==='continue')settleResult('continue');else if(id.startsWith('buy:'))buyUpgrade(id.split(':')[1]);else if(id==='reset'){if(confirm('픽셀 V4 저장 기록을 초기화할까요?')){localStorage.removeItem(SAVE_KEY);location.reload()}}}
