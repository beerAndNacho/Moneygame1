class PixelAudio{constructor(){this.ctx=null;this.master=null;this.music=null;this.amb=null;this.sfx=null;this.timer=0;this.step=0;this.next=0;this.noise=null;this.reel=null;this.enabled=true;this.running=false}ensure(){if(this.ctx)return;const AC=window.AudioContext||window.webkitAudioContext;if(!AC)throw Error('이 브라우저는 Web Audio를 지원하지 않습니다.');this.ctx=new AC();this.master=this.ctx.createGain();this.music=this.ctx.createGain();this.amb=this.ctx.createGain();this.sfx=this.ctx.createGain();this.master.gain.value=.82;this.music.gain.value=.30;this.amb.gain.value=.13;this.sfx.gain.value=.55;this.music.connect(this.master);this.amb.connect(this.master);this.sfx.connect(this.master);this.master.connect(this.ctx.destination)}async unlock(){this.ensure();if(this.ctx.state!=='running')await this.ctx.resume();if(!this.running){this.running=true;this.startAmbient();this.next=this.ctx.currentTime+.03;this.scheduler()}}scheduler(){if(!this.running)return;while(this.next<this.ctx.currentTime+.22){this.scheduleStep(this.step++,this.next);this.next+=.25}this.timer=setTimeout(()=>this.scheduler(),70)}note(freq,when,dur=.14,type='square',vol=.05,bus=this.music){if(!this.ctx||!this.enabled)return;const o=this.ctx.createOscillator(),g=this.ctx.createGain();o.type=type;o.frequency.setValueAtTime(freq,when);g.gain.setValueAtTime(.0001,when);g.gain.exponentialRampToValueAtTime(vol,when+.008);g.gain.exponentialRampToValueAtTime(.0001,when+dur);o.connect(g);g.connect(bus);o.start(when);o.stop(when+dur+.03)}scheduleStep(step,when){if(!this.enabled)return;const title=[220,0,277,0,330,0,277,0,196,0,247,0,294,0,247,0],play=[147,0,196,0,220,0,196,0,165,0,220,0,247,0,220,0],arr=scene==='play'?play:title,f=arr[step%arr.length];if(f)this.note(f,when,.17,'square',scene==='play'?.037:.031);if(step%4===0)this.note((scene==='play'?[73.4,82.4,98,82.4]:[110,98,82.4,98])[(step/4)%4|0],when,.23,'triangle',.045);if(step%8===6&&scene==='play')this.note(392,when,.055,'square',.018)}startAmbient(){const len=this.ctx.sampleRate*2,buf=this.ctx.createBuffer(1,len,this.ctx.sampleRate),d=buf.getChannelData(0);let last=0;for(let i=0;i<len;i++){const white=Math.random()*2-1;last=last*.985+white*.015;d[i]=last*.8}const src=this.ctx.createBufferSource(),filter=this.ctx.createBiquadFilter(),gain=this.ctx.createGain();src.buffer=buf;src.loop=true;filter.type='lowpass';filter.frequency.value=520;gain.gain.value=.48;src.connect(filter);filter.connect(gain);gain.connect(this.amb);src.start();this.noise={src,gain}}ping(kind='good'){if(!this.ctx||!this.enabled)return;const now=this.ctx.currentTime;if(kind==='perfect'){this.note(659,now,.09,'square',.11,this.sfx);this.note(988,now+.07,.13,'square',.09,this.sfx)}else if(kind==='catch'){[392,523,659,784].forEach((f,i)=>this.note(f,now+i*.075,.16,'square',.09,this.sfx))}else if(kind==='warn'){this.note(98,now,.2,'sawtooth',.10,this.sfx)}else this.note(440,now,.07,'square',.065,this.sfx)}startReel(){if(!this.ctx||!this.enabled||this.reel)return;const o=this.ctx.createOscillator(),g=this.ctx.createGain(),lfo=this.ctx.createOscillator(),lg=this.ctx.createGain();o.type='sawtooth';o.frequency.value=57;lfo.frequency.value=7;lg.gain.value=8;lfo.connect(lg);lg.connect(o.frequency);g.gain.value=.0001;o.connect(g);g.connect(this.sfx);const now=this.ctx.currentTime;g.gain.exponentialRampToValueAtTime(.034,now+.04);o.start();lfo.start();this.reel={o,g,lfo}}stopReel(){if(!this.reel||!this.ctx)return;const r=this.reel,now=this.ctx.currentTime;r.g.gain.cancelScheduledValues(now);r.g.gain.setValueAtTime(Math.max(.0001,r.g.gain.value),now);r.g.gain.exponentialRampToValueAtTime(.0001,now+.05);r.o.stop(now+.06);r.lfo.stop(now+.06);this.reel=null}toggle(){this.enabled=!this.enabled;if(this.master)this.master.gain.setTargetAtTime(this.enabled?.82:.0001,this.ctx.currentTime,.03);if(!this.enabled)this.stopReel();return this.enabled}}
const audio=new PixelAudio();
function drawSky(){px(0,0,W,122,'#08152a');px(0,36,W,86,'#0b1d34');px(0,72,W,50,'#123047');for(let i=0;i<36;i++){const x=(i*47+13)%W,y=(i*29+7)%82;px(x,y,i%8===0?2:1,1,i%3===0?'#7a9eaa':'#365365')}ctx.fillStyle='#132b39';ctx.beginPath();ctx.moveTo(0,107);ctx.lineTo(24,96);ctx.lineTo(45,105);ctx.lineTo(67,91);ctx.lineTo(94,104);ctx.lineTo(125,94);ctx.lineTo(156,106);ctx.lineTo(184,88);ctx.lineTo(216,101);ctx.lineTo(216,122);ctx.lineTo(0,122);ctx.fill();for(let i=0;i<18;i++){const x=166+(i%6)*7,y=106-Math.floor(i/6)*5;px(x,y,7,5,i%3===0?'#76898a':i%3===1?'#536b70':'#344b55')}px(181,61,14,45,'#aa3d35');px(183,63,10,42,'#c74b3d');px(179,58,18,5,'#702c2c');px(183,49,10,10,'#26323a');px(181,47,14,3,'#5e2f2c');px(186,40,3,8,'#727b78');px(184,69,6,4,'#f2cd62');px(185,70,4,2,'#fff1a7');if(Math.sin(time*2)>-.15){ctx.globalAlpha=.16;ctx.fillStyle='#ffe38a';ctx.beginPath();ctx.moveTo(188,70);ctx.lineTo(132,49);ctx.lineTo(136,87);ctx.fill();ctx.globalAlpha=1}}

function drawBoat(){const bob=Math.round(Math.sin(time*2.4)*1.2),y=111+bob;px(58,y+22,99,3,'#06151c');ctx.fillStyle=C.boat;ctx.beginPath();ctx.moveTo(55,y+5);ctx.lineTo(161,y+5);ctx.lineTo(151,y+24);ctx.lineTo(68,y+24);ctx.fill();px(62,y+6,94,4,C.boatHi);px(75,y+20,70,4,'#5b3029');px(91,y-6,50,12,'#5b3b2d');px(97,y-8,38,3,'#b5734e');px(127,y-23,19,18,'#c9b58b');px(129,y-21,7,7,'#153647');px(138,y-21,6,7,'#153647');px(144,y-28,2,7,'#4b3c34');px(142,y-30,7,3,C.yellow);px(144,y-29,3,2,'#fff0a0');px(72,y-5,12,10,'#263f48');px(75,y-2,6,6,'#0a2230');px(84,y-1,6,2,C.yellow);for(let t=0;t<2;t++){const x=147+t*8,yy=y-4+t*3;px(x,yy,9,8,'#132a34');for(let a=1;a<8;a+=3){px(x+a,yy,1,8,'#7a9f9b');px(x,yy+a,9,1,'#7a9f9b')}}const pull=scene==='play'&&state.holding,cx=104,cy=y-24;px(cx-4,cy+8,9,10,C.coat);px(cx-6,cy+11,3,6,C.coat);px(cx+5,cy+10,pull?8:4,3,C.coat);px(cx-3,cy+18,3,6,'#15313b');px(cx+2,cy+18,3,6,'#15313b');px(cx-4,cy,9,9,C.skin);px(cx-5,cy-2,11,4,'#c95043');px(cx-3,cy-5,8,4,'#df6651');px(cx-2,cy+4,1,1,'#2f2925');px(cx+2,cy+4,1,1,'#2f2925');if(pull){px(cx+12,cy+11,2,7,'#d8ad66');px(cx+13,cy+17,1,4,'#d8ad66')}return{ropeX:116,ropeY:y+18}}

function drawTitle(){drawSky();drawSea();drawRocksAndFloor();const p=drawBoat();text('통발 굴리는 날',108,164,17,C.white,'center','800');text('여름의 통발',108,188,9,C.yellow,'center');line(64,203,152,203,'#4a887f');text('파도와 장력을 읽고, 깊은 바다를 건져 올리세요',108,211,7,C.muted,'center');for(let y=p.ropeY;y<284;y+=4)px(p.ropeX,y,2,4,(y/4|0)%2?'#ad8058':'#c79b65');px(p.ropeX-7,284,16,15,'#172d36');for(let x=-4;x<7;x+=3)px(p.ropeX+x,286,1,11,'#9cad9f');text('픽셀 리빌드 0.4',108,315,7,C.cyan,'center');text('작은 배 · 작은 어부 · 깊은 수중 플레이',108,328,7,C.muted,'center');for(let i=0;i<9;i++)px(15+i*23,374+(i%2),13,1,'#2e6570')}
function triggerEvent(){const events=[['몸부림! 손을 잠깐 놓으세요',7],['급류! 장력이 빠르게 오릅니다',8],['커다란 그림자가 스쳐 갑니다',5],['잔잔한 물결 · PERFECT 기회',6]],e=events[Math.floor(Math.random()*events.length)];state.event=e[0];state.eventTime=e[1];state.nextEvent=rand(6.5,10.5);audio.ping(e[0].includes('그림자')?'warn':'good')}
function update(dt){time+=dt;if(scene!=='play')return;if(state.phase==='lowering'){if(time-state.startedAt>1.7){state.phase='reeling';state.message='파도 리듬에 맞춰 길게 눌러 회수';showToast('통발 도착 · 회수를 시작하세요')}return}if(state.phase==='result')return;state.ropeSway=Math.sin(time*3.2)*(state.event.includes('급류')?4:1);if(state.eventTime>0){state.eventTime-=dt;if(state.eventTime<=0){state.event='';state.nextEvent=rand(6,10)}}else{state.nextEvent-=dt;if(state.nextEvent<=0)triggerEvent()}const marker=12+((Math.sin(time*1.8)+1)/2)*188,perfect=marker>=151&&marker<=196;let rise=0;if(state.holding){rise=(FAST?38:13.5)*dt;state.tension+=dt*(state.event.includes('급류')?29:state.event.includes('몸부림')?24:15);if(perfect){rise*=2.15;state.tension-=dt*8;state.combo+=dt*3.2;state.perfectFlash=.12}else if(marker>130){rise*=1.3;state.combo+=dt*.5}else state.combo=Math.max(0,state.combo-dt*.2);if(state.event.includes('몸부림'))state.lock-=dt*5.5;if(state.event.includes('그림자'))state.lock-=dt*1.8;state.progress+=rise;state.message=perfect?'PERFECT · 통발이 가볍게 올라옵니다':'장력을 보며 천천히 감는 중'}else{state.tension-=dt*24;state.message=state.tension>64?'좋아요 · 장력을 낮추는 중':'버튼을 눌러 회수하세요'}if(state.tension>84){state.durability-=dt*(state.tension-80)*.42;state.lock-=dt*1.2;state.message='위험! 손을 놓아 장력을 낮추세요'}state.tension=clamp(state.tension,0,100);state.lock=clamp(state.lock,0,100);state.durability=clamp(state.durability,0,100);state.progress=clamp(state.progress,0,100);state.perfectFlash=Math.max(0,state.perfectFlash-dt);if(state.durability<=0||state.lock<=0)finish(false);else if(state.progress>=100)finish(true)}
function finish(success){state.phase='result';state.holding=false;audio.stopReel();const b=Math.floor(state.combo);if(b>state.best){state.best=b;try{localStorage.setItem('moneygame1-pixel-best',b)}catch{}}setTimeout(()=>{scene='result';state.success=success;state.catchIndex=Math.floor(Math.random()*3);audio.ping(success?'catch':'warn')},420)}
function drawResult(){px(0,0,W,H,'#05080d');for(let i=0;i<40;i++)px((i*41)%W,(i*67)%H,1,1,i%3?'#17222a':'#39434a');text(state.success?'통발 회수 성공':'일부 어획물 탈출',108,48,10,state.success?C.yellow:C.red,'center');text(state.success?'바닷속에서 묵직한 움직임이 느껴집니다':'통발을 수리하고 다시 도전하세요',108,66,7,C.muted,'center');const names=['붉은바위 게','푸른밤 문어','달빛 소라'],cols=['#e65d3f','#7e6be2','#d7b774'];drawCatchSprite(108,192,state.catchIndex,cols[state.catchIndex]);text(names[state.catchIndex],108,251,13,C.white,'center');text(state.success?'희귀 · 신규 도감 등록':'일반 · 부분 회수',108,271,8,state.success?C.cyan:C.muted,'center');panel(35,294,146,55);text('길이',50,306,7,C.muted);text(`${(18.2+state.catchIndex*6.8).toFixed(1)} cm`,166,306,8,C.white,'right');text('무게',50,321,7,C.muted);text(`${(0.76+state.catchIndex*.43).toFixed(2)} kg`,166,321,8,C.white,'right');text('판매가',50,336,7,C.muted);text(`${state.success?3240:620} 조개`,166,336,8,C.yellow,'right');px(34,370,148,29,'#0b3c48');px(35,371,146,27,'#145563');text('다시 통발 내리기',108,380,8,C.cyan2,'center');text('화면 아래 버튼을 눌러 다시 출항',108,421,7,C.muted,'center')}
function drawCatchSprite(cx,cy,type,col){ctx.save();const s=4,R=(x,y,w,h,c)=>px(cx-32+x*s,cy-32+y*s,w*s,h*s,c);if(type===0){R(5,5,6,7,col);R(3,7,2,4,col);R(11,7,2,4,col);R(1,7,2,2,col);R(13,7,2,2,col);R(4,12,2,2,col);R(10,12,2,2,col);R(6,4,1,2,'#f2c45b');R(9,4,1,2,'#f2c45b');R(6,7,1,1,'#111');R(9,7,1,1,'#111');R(7,10,2,1,'#7b2b2a')}else if(type===1){R(5,3,6,7,col);R(6,2,4,2,'#a99bf1');R(6,6,1,1,'#111');R(9,6,1,1,'#111');for(let i=0;i<4;i++){R(4+i*2,10,1,5,col);R(3+i*3,14,2,1,'#5c4ab3')}}else{R(4,4,8,8,col);R(5,3,6,2,'#efe1ab');R(6,5,5,5,'#78624d');R(7,6,3,3,'#d7b774');R(8,7,1,1,'#78624d');R(3,10,3,2,col);R(2,11,2,2,'#efe1ab')}ctx.restore()}
function render(){ctx.imageSmoothingEnabled=false;ctx.clearRect(0,0,W,H);if(scene==='title'){drawTitle();return}if(scene==='result'){drawResult();return}drawSky();drawSea();drawRocksAndFloor();const p=drawBoat();drawTrap(p.ropeX,p.ropeY);drawHud();drawTimingUi();if(state.perfectFlash>0){ctx.globalAlpha=state.perfectFlash*3;px(0,122,W,200,C.cyan2);ctx.globalAlpha=1}}
function loop(now){const dt=Math.min(.034,(now-last)/1000);last=now;update(dt);render();requestAnimationFrame(loop)}
function resetPlay(){scene='play';time=0;state={...state,depth:8,progress:0,tension:12,lock:100,durability:100,combo:0,holding:false,phase:'lowering',message:'통발을 내려 보내는 중…',event:'',eventTime:0,nextEvent:5.4,perfectFlash:0,ropeSway:0,startedAt:0};state.startedAt=time}
async function startGame(){try{await audio.unlock();document.body.dataset.audio=audio.ctx.state;gate.hidden=true;soundBtn.hidden=false;soundBtn.textContent='♪ ON';resetPlay();showToast('BGM ON · 통발을 내립니다')}catch(e){gate.hidden=true;soundBtn.hidden=false;soundBtn.textContent='♪ ERR';resetPlay();showToast('게임은 실행되지만 소리를 시작하지 못했습니다')}}
startBtn.addEventListener('click',startGame);soundBtn.addEventListener('click',async()=>{try{await audio.unlock();const on=audio.toggle();soundBtn.textContent=on?'♪ ON':'♪ OFF';showToast(on?'배경음 켜짐':'배경음 꺼짐')}catch(e){showToast('오디오를 시작하지 못했습니다')}});
function insideHold(e){const r=canvas.getBoundingClientRect(),x=(e.clientX-r.left)*W/r.width,y=(e.clientY-r.top)*H/r.height;return y>=382&&y<=455&&x>=8&&x<=208}
canvas.addEventListener('pointerdown',async e=>{e.preventDefault();try{await audio.unlock()}catch{}if(scene==='result'){resetPlay();audio.ping('good');return}if(scene!=='play'||state.phase!=='reeling')return;if(insideHold(e)){canvas.setPointerCapture?.(e.pointerId);state.holding=true;audio.startReel()}});function release(){state.holding=false;audio.stopReel()}canvas.addEventListener('pointerup',release);canvas.addEventListener('pointercancel',release);canvas.addEventListener('pointerleave',e=>{if(e.buttons===0)release()});document.addEventListener('visibilitychange',()=>{if(document.hidden)release();else if(audio.ctx&&audio.enabled)audio.ctx.resume().catch(()=>{})});window.addEventListener('error',e=>{fallback.style.display='grid';fallback.textContent='게임 실행 오류: '+(e.message||'알 수 없는 오류')});requestAnimationFrame(loop);
})();
</script>
</body>
